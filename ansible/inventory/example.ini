# INVENTORY ILUSTRATIF -- ganti dengan host nyata Anda.
# Pola penamaan host: <env>-<dc>-<layer>-<app>-<no>
# (lihat docs/infrastructure/infrastructure-standards.md paragraf 3).
# Alamat IP di bawah mengikuti pola subnet pada
# docs/architecture/network-architecture.md paragraf 2 (range 10.10.x.x).

[core]
# Zona terbatas (restricted zone) -- hanya dapat diakses via middleware/bastion.
prod-dc1-core-cbsnode-01 ansible_host=10.10.30.11
prod-dc1-core-cbsnode-02 ansible_host=10.10.30.12

[app]
# Zona aplikasi / digital channel service.
prod-dc1-app-transfersvc-01 ansible_host=10.10.12.11
prod-dc1-app-authsvc-01 ansible_host=10.10.12.12

[middleware]
# Zona ESB / message broker.
prod-dc1-mid-kafka-01 ansible_host=10.10.20.11

[all:vars]
ansible_user=svc_ansible
# Jangan pernah menaruh kredensial di inventory; kredensial diambil dari
# ansible-vault atau secret manager (CI) saat eksekusi nyata.