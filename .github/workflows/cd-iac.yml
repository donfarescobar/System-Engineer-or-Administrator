name: CD - Pipeline Terraform Production

# Pipeline ini menerjemahkan alur cicd-pipeline.md bab 6 (IaC):
#   PR -> plan otomatis -> approval manusia (GitHub Environment) -> apply.
# Kredensial AWS tidak pernah dihardcode; memakai OIDC federated role.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Jalankan plan atau apply?"
        type: choice
        options: [plan, apply]
        default: plan
        required: true
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

# Satu eksekusi apply per waktu, mencegah konflik state (state locking.
concurrency:
  group: tf-production
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform plan
    environment: non-prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Konfigurasi credential AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_IAC }}
          aws-region: ap-southeast-3
      - name: Terraform init (remote backend + state locking)
        run: |
          terraform init \
            -backend-config=bucket=${{ secrets.TF_STATE_BUCKET }} \
            -backend-config=key=prod/cloud-tier/terraform.tfstate \
            -backend-config=region=ap-southeast-3 \
            -backend-config=dynamodb_table=${{ secrets.TF_LOCK_TABLE }} \
            -backend-config=encrypt=true
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform validate
        run: terraform validate -no-color
      - name: Terraform plan
        id: plan
        run: |
          terraform plan -input=false \
            -var-file=../envs/prod/terraform.tfvars \
            -out=tfplan.binary
      - name: Simpan plan sebagai artifact (immutable)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan.binary
          retention-days: 7

  apply:
    name: Terraform apply (production)
    # Environment 'production' dengan protection rules (required reviewers)
    # berperan sebagai approval gate manusia sebelum apply.
    needs: plan
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Konfigurasi credential AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_IAC }}
          aws-region: ap-southeast-3
      - name: Unduh plan hasil verifikasi (immutable, tanpa re-plan)
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      - name: Terraform init (remote backend + state locking)
        run: |
          terraform init \
            -backend-config=bucket=${{ secrets.TF_STATE_BUCKET }} \
            -backend-config=key=prod/cloud-tier/terraform.tfstate \
            -backend-config=region=ap-southeast-3 \
            -backend-config=dynamodb_table=${{ secrets.TF_LOCK_TABLE }} \
            -backend-config=encrypt=true
      - name: Terapkan plan (tanpa re-plan)
        run: terraform apply -input=false tfplan.binary
