apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-orchestrator
  namespace: digital-channel
  labels:
    app.kubernetes.io/name: transfer-orchestrator
    app.kubernetes.io/part-of: banking-portfolio
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: transfer-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transfer-orchestrator
        # Label dipakai NetworkPolicy ingress (lihat networkpolicy.yaml)
        network-policy/access: allowed
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: transfer-orchestrator
      containers:
        - name: app
          image: registry.example.local/digital-channel/transfer-orchestrator:1.2.0
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
