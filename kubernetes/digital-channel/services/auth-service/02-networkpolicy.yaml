# NetworkPolicy untuk auth-service.
# Ingress: hanya dari pod berlabel network-policy/access=allowed (gateway).
# Egress: DNS (UDP/TCP 53) ke kube-dns dan HTTPS ke endpoint whitelisted.
# Tidak ada akses egress ke broker/DB secara langsung.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service
  namespace: digital-channel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              network-policy/access: allowed
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dmz
      ports:
        - protocol: TCP
          port: 443
